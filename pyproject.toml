[project]
name = "comfyui-qg-tools"
description = "A ComfyUI custom node pack by QG: 27 nodes under QG-tools - LoRA Loader (searchable rows, drag strengths, trigger words, templates), a 3-in-1 Checkpoint/UNET + CLIP + VAE loader, canvas Image Crop + Rotate + Pad with video timeline, Image Compare (slide / A / B / erase, layered PSD), Image Export (JPEG / PNG / WEBP with quality), Canvas Label and Markdown Note (free text on the canvas, never executed), Workflow Note card, Workflow Switches, Run Timer, Resize, Size, Seed history, Text, Markdown Reader, Translate, Any Switch, Display Any, If/Else, Watermark, Text Overlay, Grid, Mask Colorize, Mask Concat, Batch Replace, Text Split, Size Selector. All answer to English search aliases."
version = "0.9.3"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/live1617/ComfyUI-QG-tools"

[tool.comfy]
PublisherId = "live1617"
DisplayName = "ComfyUI-QG-Tools"
