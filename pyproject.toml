[project]
name = "comfyui-qg-tools"
description = "A ComfyUI custom node pack by QG. Currently ships six nodes: a full-featured LoRA Loader (searchable rows, drag-to-set model/CLIP strengths, trigger-word merging, named templates, model-chain LoRA absorption), a Workflow Note card, a Workflow Switches panel, an Image Crop + Rotate + Pad editor with a canvas-based crop/rotate/pad UI and video timeline support, a Run Timer stopwatch, and a Text Edit Output box."
version = "0.6.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

