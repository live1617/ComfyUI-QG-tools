[project]
name = "comfyui-qg-tools"
description = "A ComfyUI custom node pack by QG. Twenty-four nodes under the QG-tools category: a full-featured LoRA Loader (searchable rows, drag-to-set strengths, trigger-word merging, named templates), a three-in-one Checkpoint/UNET + CLIP + VAE loader, a canvas-based Image Crop + Rotate + Pad editor with video timeline, an Image Compare panel (slide / A / B / erase, save PNG with optional layered PSD), a Workflow Note card, a Workflow Switches panel, a Run Timer, image helpers (Resize, Size), a Seed card with 8-entry history, flow helpers (Text, Markdown Reader, Translate, Any Switch, Display Any, If/Else), and image/mask/text utilities (Watermark, Text Overlay, Grid, Mask Colorize, Mask Concat, Batch Replace, Text Split, Size Selector). Every node also answers to English search aliases."
version = "0.9.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/live1617/ComfyUI-QG-tools"

[tool.comfy]
PublisherId = "live1617"
DisplayName = "ComfyUI-QG-Tools"
