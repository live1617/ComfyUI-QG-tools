[project]
name = "comfyui-qg-tools"
description = "A ComfyUI custom node pack by QG. Twenty-three nodes under the QG-tools category: a full-featured LoRA Loader (searchable rows, drag-to-set strengths, trigger-word merging, named templates, model-chain absorption), a three-in-one Checkpoint/UNET + CLIP + VAE loader, a canvas-based Image Crop + Rotate + Pad editor with video timeline support, a Workflow Note card, a Workflow Switches panel, a Run Timer stopwatch, image helpers (Image Resize, Image-or-Latent Size), a Seed card (random / fixed / step control with an 8-entry history), plus text and flow helpers (Text, Markdown Reader, Google Translate, Any Switch, Display Any, If/Else), and image/mask/text utilities (Image Watermark, Text Overlay Image, Image Grid, Mask Colorize, Mask Concat, Batch Text Replace, Text Split by Delimiter, Size Selector)."
version = "0.8.5"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/live1617/ComfyUI-QG-tools"

[tool.comfy]
PublisherId = "live1617"
DisplayName = "ComfyUI-QG-Tools"
